<!DOCTYPE html>
<html>
<head>
    <title>Seminar</title>

    <style>
        table {
            width: 650px;
        }

        th, td {
            border: 2px solid gray;
            padding: 8px;
            text-align: center;
            font-size: 18px;
        }

        th {
            font-weight: bold;
        }

        .yellow {
            background-color: lightyellow;
        }

        .green {
            background-color: lightgreen;
        }

        .purple {
            background-color: #d8c5ff;
        }
    </style>
</head>

<body>

<table>

    <thead>

        <tr>
            <th rowspan="3">Day</th>
            <th colspan="2">Seminar</th>
            <th rowspan="3">Topic</th>
        </tr>

        <tr>
            <th colspan="2">Schedule</th>
        </tr>

        <tr>
            <th>Begin</th>
            <th>End</th>
        </tr>

    </thead>


    <tbody>

        <tr>
            <td rowspan="2">Monday</td>

            <td class="yellow">8:00 a.m.</td>
            <td class="purple">5:00 p.m.</td>

            <td>Introduction to XML</td>
        </tr>

        <tr>
            <td colspan="2"></td>
            <td>Validity: DTD and Relax NG</td>
        </tr>


        <tr>
            <td rowspan="3">Tuesday</td>

            <td class="yellow">8:00 a.m.</td>
            <td class="green">11:00 a.m.</td>

            <td rowspan="2">XPath</td>
        </tr>

        <tr>
            <td class="green">11:00 a.m.</td>
            <td class="green">2:00 p.m.</td>
        </tr>

        <tr>
            <td class="green">2:00 p.m.</td>
            <td class="purple">5:00 p.m.</td>

            <td>XSL Transformations</td>
        </tr>


        <tr>
            <td>Wednesday</td>

            <td class="yellow">8:00 a.m.</td>
            <td class="green">12:00 p.m.</td>

            <td>XSL Formatting Objects</td>
        </tr>

    </tbody>


    <tfoot>
    </tfoot>

</table>

</body>
</html>
