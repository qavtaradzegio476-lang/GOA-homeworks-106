<!-- შექმენით Web Page-ი სადაც გექნებათ შექმნილი 3 div ბლოკი. პირველში ჩასვით მარტო ლინკები (anchor tags), მეორეში მარტო ტექსტები და მესამეში
 მარტო სურათები, შემდგომ ამ დივ ბლოკებზე გამოიყენეთ ყველა CSS-ის კუთვნილება რაც კი გავიარეთ ჯგუფში (color, background-color, text-align,
  font-size, border და display).
  -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Divs</title>
</head>

<body>

    <!-- პირველი div - მხოლოდ ლინკები -->
    <div style="color: white; background-color: black; text-align: center; font-size: 20px; border: 2px solid red; display: block;">
        <a href="https://www.google.com" style="color: white;">Google</a>
        <a href="https://www.youtube.com" style="color: white;">YouTube</a>
        <a href="https://www.facebook.com" style="color: white;">Facebook</a>
    </div>


    <!-- მეორე div - მხოლოდ ტექსტები -->
    <div style="color: blue; background-color: lightgray; text-align: center; font-size: 20px; border: 2px solid blue; display: block;">
        Hello, my name is Gio.
        I am learning HTML.
        I like programming.
    </div>


    <!-- მესამე div - მხოლოდ სურათები -->
    <div style="background-color: lightgreen; text-align: center; font-size: 20px; border: 2px solid green; display: block;">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSmNNauAL2luJn_5Kwld_Har7h9cW8xAZPctIWJckIsdQ&s" alt="Image">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS7X0yZ15Bx1_rJgcZ9d-dcZ5fJhFgBgSZvVNhUv8OKrQ&s" alt="Image">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRw9kfUBavQCgjyRpGvCzl807G-WGi-aAWUhpaHN8q06A&s=10" alt="Image">
    </div>

</body>
</html>
