<!DOCTYPE html>
<html>
<head>
    <title>CSS Types</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        h2 {
            color: blue;
        }

        .internal2 {
            background-color: yellow;
        }

        .internal3 {
            text-align: center;
        }

        .internal4 {
            font-size: 25px;
        }

        .internal5 {
            color: green;
        }
    </style>
</head>

<body>

    <h1>Inline CSS</h1>

    <!-- 1 -->
    <p style="color: red;">Red text</p>

    <!-- 2 -->
    <p style="background-color: yellow;">Yellow background</p>

    <!-- 3 -->
    <p style="text-align: center;">Center text</p>

    <!-- 4 -->
    <p style="font-size: 25px;">Big text</p>

    <!-- 5 -->
    <p style="color: blue; background-color: yellow;">Blue text and yellow background</p>


    <h1>Internal CSS</h1>

    <!-- 1 -->
    <h2>Blue text</h2>

    <!-- 2 -->
    <p class="internal2">Yellow background</p>

    <!-- 3 -->
    <p class="internal3">Center text</p>

    <!-- 4 -->
    <p class="internal4">Big text</p>

    <!-- 5 -->
    <p class="internal5">Green text</p>


    <h1>External CSS</h1>

    <!-- 1 -->
    <p class="external1">Blue text</p>

    <!-- 2 -->
    <p class="external2">Yellow background</p>

    <!-- 3 -->
    <p class="external3">Center text</p>

    <!-- 4 -->
    <p class="external4">Big text</p>

    <!-- 5 -->
    <p class="external5">Green text</p>

</body>
</html>
